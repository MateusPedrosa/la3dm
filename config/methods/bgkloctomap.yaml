# BGKLOctoMap config

frame_id: ned_origin

# Map topic, grid cell mininum resolution
topic: /occupied_cells_vis_array
resolution: 0.1
block_depth: 3 # Test-data octree depth (see Wang & Englot ICRA 2016)

# Kernel parameters
sf2: 0.1 # Actually sigma_0 in sparse kernel
ell: 0.2 # Length scale of the sparse kernel

# Sampling resolutions
free_resolution: 0.3 # Free space sampling res
ds_resolution: 0.1  # Downsampling factor
swath_angle: -1.0   # Total multibeam swath width (degrees); -1 = disabled (azimuth culling off)

# Free/Occupied Thresholds
free_thresh: 0.3
occupied_thresh: 0.7

# BGK Inference positive and negative class prior pseudocounts
prior_A: 0.001 # Positive class (occupied)
prior_B: 0.001 # Negative class (unoccupied)
var_thresh: 0.15 # Threshold on variance to distinguish known/unknown

# Visualization scaling parameters
max_var_vis: 0.25        # Variance at which color saturates to red
max_constraint_vis: 5.0  # lambda_max (trace of info matrix) at which color saturates to purple

# Coarse occupied-voxel visualization for path-planner safety margin
# Publishes to /occupied_cells_coarse_vis_array with voxel side = resolution * 2^N
coarse_depth_steps: 2  # default: 4x voxel (0.4 m at 0.1 m resolution)

# Pose-level novelty weighting
# When true, replaces per-voxel w_novelty in the Beta update with a per-frame w_pose
# computed from distance between current sonar pose and a history of K prior poses.
# The per-voxel w_novelty is still computed for the info matrix and NBV planner.
use_pose_level_weighting: false   # false = per-voxel mode (backward compat default)
pose_history_size: 20             # K: rolling history length
pose_novelty_sigma: 0.3           # Gaussian bandwidth in SE(3) distance space
pose_w_roll:       1.0            # Weight for roll component of SO(3) distance
pose_w_pitch:      0.6            # Weight for pitch
pose_w_yaw:        0.05           # Weight for yaw (low: sonar often spins)
pose_w_vx_per_l2:  0.2            # Weight for longitudinal displacement / l²
pose_w_vy_per_l2:  0.05           # Weight for lateral displacement / l²
pose_w_vz_per_l2:  0.5            # Weight for vertical displacement / l²

# Ablation flags (for experiments — disable in production)
ablate_directional_weights: false  # true: skip w_range, w_voxel, and info-matrix update; raw Beta accumulation
